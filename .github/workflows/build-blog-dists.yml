name: Build blog dists

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: blog-dists-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Hexo, Hugo, and Astro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            hexo-blog/package-lock.json
            astro-blog/package-lock.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build Hexo
        working-directory: hexo-blog
        run: |
          npm ci
          npm run clean
          npm run build

      - name: Prepare Hugo Stack theme
        working-directory: hugo-blog
        run: |
          if [ ! -d "themes/hugo-theme-stack/layouts" ]; then
            rm -rf themes/hugo-theme-stack
            git clone --depth 1 https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack
          fi

      - name: Build Hugo
        working-directory: hugo-blog
        run: hugo --minify --destination public

      - name: Build Astro
        working-directory: astro-blog
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Add .nojekyll files
        run: |
          touch hexo-blog/public/.nojekyll
          touch hugo-blog/public/.nojekyll
          touch astro-blog/dist/.nojekyll

      - name: Deploy Hexo dist
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: dist-hexo
          folder: hexo-blog/public
          clean: true
          single-commit: true

      - name: Deploy Hugo dist
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: dist-hugo
          folder: hugo-blog/public
          clean: true
          single-commit: true

      - name: Deploy Astro dist
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: dist-astro
          folder: astro-blog/dist
          clean: true
          single-commit: true
