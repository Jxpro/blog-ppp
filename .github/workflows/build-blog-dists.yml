name: Build blog dists

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: blog-dists-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Hexo, Hugo, and Astro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            hexo-blog/package-lock.json
            astro-blog/package-lock.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build Hexo
        working-directory: hexo-blog
        run: |
          npm ci
          npm run clean
          npm run build

      - name: Prepare Hugo Stack theme
        working-directory: hugo-blog
        run: |
          if [ ! -d "themes/hugo-theme-stack/layouts" ]; then
            rm -rf themes/hugo-theme-stack
            git clone --depth 1 https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack
          fi

      - name: Build Hugo
        working-directory: hugo-blog
        run: hugo --minify --destination public

      - name: Build Astro
        working-directory: astro-blog
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Publish dists to branches
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_dist() {
            local source_dir="$1"
            local branch="$2"
            local worktree=".deploy-${branch}"

            if [ ! -d "$source_dir" ]; then
              echo "Missing dist directory: $source_dir" >&2
              exit 1
            fi

            git worktree remove "$worktree" --force 2>/dev/null || true
            git worktree prune

            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch origin "$branch"
              git worktree add "$worktree" "origin/$branch"
            else
              git worktree add --detach "$worktree"
              git -C "$worktree" checkout --orphan "$branch"
            fi

            find "$worktree" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$source_dir"/. "$worktree"/
            touch "$worktree/.nojekyll"

            git -C "$worktree" add -A
            if git -C "$worktree" diff --cached --quiet; then
              echo "No changes for $branch"
            else
              git -C "$worktree" commit -m "Deploy ${branch} from ${GITHUB_SHA}"
              git -C "$worktree" push origin HEAD:"$branch" --force
            fi

            git worktree remove "$worktree" --force
          }

          publish_dist "hexo-blog/public" "dist-hexo"
          publish_dist "hugo-blog/public" "dist-hugo"
          publish_dist "astro-blog/dist" "dist-astro"
