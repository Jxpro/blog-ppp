# Hexo Butterfly theme overrides.
# The full default theme config is provided by hexo-theme-butterfly in node_modules.

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags

code_blocks:
  theme: light
  macStyle: true
  copy: true
  language: true
  shrink: false
  fullpage: false

avatar:
  img:
  effect: false

disable_top_img: true
default_top_img: false
index_img: false
archive_img: false
tag_img: false
category_img: false
footer_img: false

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  default_cover: false

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: false
    label: true

index_site_info_top:
  enable: true

subtitle:
  enable: false

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: 系统、编程、工具与区块链笔记。
    button:
      enable: false
  card_announcement:
    enable: false
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: false
    limit: 30
    color: false

local_search:
  enable: false

beautify:
  enable: true
  field: post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: '#f47466'

darkmode:
  enable: true
  button: true
  autoChangeMode: false
