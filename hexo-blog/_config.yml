title: Joker Xin's Blog
subtitle: '系统、编程与工具笔记'
description: Joker Xin 的系统、编程、工具、区块链笔记。
keywords: Joker Xin, Hexo, Linux, Docker, Git, Python, Blockchain
author: Joker Xin
language: zh-CN
timezone: Asia/Shanghai

url: https://jokerxin.github.io
permalink: :year/:month/:day/:slug/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: src
public_dir: dist
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:
meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 10
pagination_dir: page

theme: butterfly

deploy:
  type: ''
